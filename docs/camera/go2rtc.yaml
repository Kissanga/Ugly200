# go2rtc for the Reolink Duo 3 - template.
# install-camera.ps1 fills CAMERA_IP, CAMERA_USER and CAMERA_PASS and writes the result to C:\NakedCam\go2rtc.yaml.
# The filled copy holds the camera password: it stays on the farm PC and never goes into this repo.

api:
  # Only this PC can open go2rtc directly. The internet reaches it through the Cloudflare Tunnel,
  # which lets through only the player paths (see README.md, step 4).
  listen: "127.0.0.1:1984"

rtsp:
  listen: ""   # go2rtc does not re-share the camera as RTSP

webrtc:
  listen: ""   # the tunnel carries HTTP only; the player uses MSE/HLS through it

streams:
  # Sub stream: H.264, which every browser plays, and light enough for a phone connection.
  duo3: rtsp://CAMERA_USER:CAMERA_PASS@CAMERA_IP:554/h264Preview_01_sub

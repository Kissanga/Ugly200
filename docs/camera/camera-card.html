<!-- Naked Heart: Cameras card. Paste where the card should appear and set CAM to your tunnel hostname.
     The dashboard only knows this address; the camera password stays on the farm PC. -->
<section class="card camera-card">
  <h3>Duo 3</h3>
  <div style="position:relative;aspect-ratio:32/9;background:#000;border-radius:8px;overflow:hidden">
    <iframe id="duo3-live" title="Duo 3 live" allow="autoplay; fullscreen" loading="lazy"
            style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
  </div>
</section>
<script>
  (function () {
    const CAM = 'https://cam.farmbox.life';   // the tunnel hostname (README step 4)
    document.getElementById('duo3-live').src = CAM + '/stream.html?src=duo3&mode=mse,hls';
  })();
</script>

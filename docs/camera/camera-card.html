<!-- Naked Heart: Cameras card. Paste where the card should appear and set CAM to your tunnel hostname.
     The dashboard only knows this address; the camera password stays on the farm PC. -->
<section class="card camera-card">
  <h3>Duo 3</h3>
  <div style="position:relative;aspect-ratio:32/9;background:#000;border-radius:8px;overflow:hidden">
    <iframe id="duo3-live" title="Duo 3 live" allow="autoplay; fullscreen" loading="lazy"
            style="position:absolute;inset:0;width:100%;height:100%;border:0"></iframe>
  </div>
  <!-- Naked Heart on github.io and the camera on another domain: Safari (iPhone/iPad) blocks the camera login inside
       the card, so this link opens the live view in its own tab, where the login always works. -->
  <a id="duo3-open" target="_blank" rel="noopener" style="display:inline-block;margin-top:8px">Open live view</a>
</section>
<script>
  (function () {
    const CAM = 'https://cam.nkd.farm';   // the tunnel hostname (README step 4)
    const live = CAM + '/stream.html?src=duo3&mode=mse,hls';
    document.getElementById('duo3-live').src = live;
    document.getElementById('duo3-open').href = live;
  })();
</script>

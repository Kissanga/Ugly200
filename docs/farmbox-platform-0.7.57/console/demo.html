<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>farmbox-crops.js demo (mock data)</title>
<style>body{margin:0;padding:20px;background:#f6f7f3;font-family:system-ui,sans-serif} .note{background:#fff3cd;padding:8px 12px;border-radius:6px;font-size:13px;margin-bottom:14px}</style>
<div class="note">Demo of <code>farmbox-crops.js</code> against an in-memory mock of supabase-js, loaded from <code>demo-data.js</code> (the tested 0.7.57 library). Writes stay in memory.</div>
<div id="cropDb"></div>
<script src="demo-data.js"></script>
<script src="farmbox-crops.js"></script>
<script>
// A tiny supabase-js v2 stand-in: enough of the query builder for the module.
(function () {
  const D = window.FBC_DEMO;           // { crop_category, crop_library, sop, sop_version, sop_step, farm, zone, position, crop, crop_phase_sop, crop_plan, task }
  window.mockCalls = [];
  const uuid = () => 'x' + Math.random().toString(36).slice(2);
  function from(table) {
    const q = { table, filters: [], op: 'select', payload: null, orders: [], lim: null, head: false, count: null };
    const b = {
      select(cols, o) { q.op = q.op === 'select' ? 'select' : q.op; q.head = !!(o && o.head); q.count = o && o.count; return b; },
      insert(rows) { q.op = 'insert'; q.payload = rows; return b; }, update(obj) { q.op = 'update'; q.payload = obj; return b; }, delete() { q.op = 'delete'; return b; },
      eq(k, v) { q.filters.push(r => r[k] === v); return b; }, is(k, v) { q.filters.push(r => r[k] == v); return b; },
      not(k, op, v) { q.filters.push(r => !(op === 'is' ? r[k] == v : r[k] === v)); return b; }, in(k, vs) { q.filters.push(r => vs.includes(r[k])); return b; },
      order(k, o) { q.orders.push([k, !(o && o.ascending === false)]); return b; }, limit(n) { q.lim = n; return b; },
      then(res, rej) { return Promise.resolve(run()).then(res, rej); }
    };
    function run() {
      const rows = D[table] || (D[table] = []);
      const hit = r => q.filters.every(f => f(r));
      if (q.op === 'insert') { const ins = (Array.isArray(q.payload) ? q.payload : [q.payload]).map(r => ({ id: uuid(), ...r })); rows.push(...ins); window.mockCalls.push(['insert', table, ins.length]); return { data: ins, error: null }; }
      if (q.op === 'update') { let n = 0; rows.forEach(r => { if (hit(r)) { Object.assign(r, q.payload); n++; } }); window.mockCalls.push(['update', table, n]); return { data: null, error: null }; }
      if (q.op === 'delete') { const keep = rows.filter(r => !hit(r)); window.mockCalls.push(['delete', table, rows.length - keep.length]); D[table] = keep; return { data: null, error: null }; }
      let out = rows.filter(hit);
      for (const [k, asc] of q.orders.slice().reverse()) out.sort((a, b) => (a[k] > b[k] ? 1 : a[k] < b[k] ? -1 : 0) * (asc ? 1 : -1));
      if (q.lim) out = out.slice(0, q.lim);
      return { data: q.head ? null : out, error: null, count: q.count ? out.length : null };
    }
    return b;
  }
  async function rpc(name, args) {
    window.mockCalls.push(['rpc', name, args]);
    if (name === 'archive_crop') { const c = D.crop.find(x => x.id === args.p_crop); c.archived_at = new Date().toISOString(); c.archived_reason = args.p_reason; D.crop_library = D.crop_library.filter(x => x.id !== c.id); return { data: null, error: null }; }
    if (name === 'restore_crop') { const c = D.crop.find(x => x.id === args.p_crop); c.archived_at = null; D.crop_library.push({ ...c, phases: [], cycle_days: 0, category_seq: 9 }); return { data: null, error: null }; }
    if (name === 'plan_crop') { const id = uuid(); D.crop_plan.push({ id, crop_id: args.p_crop, status: 'active' }); for (let i = 0; i < 12; i++) D.task.push({ id: uuid(), plan_id: id }); return { data: id, error: null }; }
    if (name === 'replan_crop') return { data: 3, error: null };
    return { data: null, error: { message: 'unknown rpc ' + name } };
  }
  window.mockSb = { from, rpc };
  window.prompt = () => 'demo';
  FarmBoxCrops.mount({ el: document.getElementById('cropDb'), sb: window.mockSb, canEdit: true }).then(api => { window.cropDb = api; });
})();
</script>
</body>
</html>

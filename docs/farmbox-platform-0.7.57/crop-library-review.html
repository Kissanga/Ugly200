<script>
(function(){
  const lib = JSON.parse(document.getElementById('lib').textContent);
  const procs = JSON.parse(document.getElementById('procsData').textContent);
  const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const slug = s => 'p-' + String(s).toLowerCase().replace(/[^a-z0-9]+/g,'-');
  const unit = { tray:'tray', position:'position', plant:'plant', m2:'m²' };
  const phases = lib.reduce((n,c)=>n+c.phases.length,0), links = lib.reduce((n,c)=>n+c.phases.reduce((m,p)=>m+p.procedures.length,0),0);
  document.getElementById('kpi').innerHTML = '<span><b>'+lib.length+'</b> crops</span><span><b>6</b> families</span><span><b>'+phases+'</b> phases</span><span><b>'+links+'</b> phase→procedure links</span><span><b>'+procs.length+'</b> procedures</span>';

  const byCat = new Map();
  lib.forEach(c => { if(!byCat.has(c.category)) byCat.set(c.category, {label:c.label, seq:c.seq, crops:[]}); byCat.get(c.category).crops.push(c); });
  let out = '';
  for (const [code, g] of [...byCat.entries()].sort((a,b)=>a[1].seq-b[1].seq)) {
    out += '<h2 style="--dot:var(--c-'+code+')"><i></i>'+esc(g.label)+' · '+g.crops.length+'</h2>';
    for (const c of g.crops) {
      out += '<details class="crop"><summary><span><b>'+esc(c.name)+'</b><div class="meta">'+esc(c.medium)+' · '+esc(c.system)+' · '+c.plugs+(c.plugs===1?' plant/tray unit':' plugs per tray')+' · '+c.phases.length+' phases</div></span><span class="days">'+c.days+' days</span></summary><div class="phases">';
      let day = 0;
      for (const p of c.phases) {
        out += '<div class="phase"><div><div class="pn">'+p.seq+'. '+esc(p.name)+'</div><div class="pd">day '+day+' · '+p.days+' d</div></div><div>';
        for (const q of p.procedures) out += '<div class="proc"><a href="#'+slug(q.title)+'" data-go="'+slug(q.title)+'">'+esc(q.title)+'</a> <span>+'+q.day_offset+(q.repeat_days?' every '+q.repeat_days+' d':'')+' · '+q.base_minutes+' + '+q.minutes_per_unit+'/'+ (unit[q.unit]||q.unit)+'</span></div>';
        out += '</div></div>'; day += p.days;
      }
      out += '</div></details>';
    }
  }
  document.getElementById('crops').innerHTML = out;

  let po = '';
  let lastSub = null;
  for (const s of procs) {
    if (s.sub !== lastSub) { po += '<h2>'+esc(s.sub)+'</h2>'; lastSub = s.sub; }
    po += '<details class="sop" id="'+slug(s.title)+'"><summary><div class="t">'+esc(s.title)+'</div><div class="m">'+s.base+' min + '+s.per+' min per '+(unit[s.unit]||s.unit)+' · '+(s.steps||[]).length+' steps'+(s.validation==='checklist_evidence'?' · evidence':'')+(s.ppe?' · PPE: '+esc(s.ppe):'')+'</div></summary><div class="body">';
    if (s.summary) po += '<p>'+esc(s.summary)+'</p>';
    if (s.tools) po += '<p class="m">Tools: '+esc(s.tools)+'</p>';
    for (const st of (s.steps||[])) {
      po += '<div class="step"><div class="sec">'+esc(st.section||'')+'</div><div class="st">'+st.seq+'. '+esc(st.title)+'<span class="type">'+esc(st.type)+(st.type==='measure'?' '+st.min+'–'+st.max+' '+esc(st.unit):'')+'</span></div>';
      if (st.instruction) po += '<div class="d">'+esc(st.instruction)+'</div>';
      if (st.expected) po += '<div class="d"><b>Expected:</b> '+esc(st.expected)+'</div>';
      if (st.plan) po += '<div class="d"><b>If not OK:</b> '+esc(st.plan)+'</div>';
      po += '</div>';
    }
    po += '</div></details>';
  }
  document.getElementById('procs').innerHTML = po;

  const views = { crops: document.getElementById('crops'), procs: document.getElementById('procs') };
  function showView(v) { for (const k in views) views[k].hidden = k !== v; document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === v))); }
  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showView(b.dataset.view));
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-go]'); if (!a) return;
    e.preventDefault(); showView('procs');
    const d = document.getElementById(a.dataset.go); if (d) { d.open = true; d.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  });
})();
</script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1bbfa8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SOP">
  <title>FarmBox SOP</title>
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400..800&display=swap" rel="stylesheet">
  <style>
    /* ═══ NAKED FARM UI v1 — shared design tokens ═══════════════════════════
       Same token block lives in Naked Brain (Ugly200/index.html). Keep in sync.
       Warm cream-to-ochre gradient ground, white rounded cards, black pill actions,
       aqua = done/active, coral = warning/urgent, ink card = the one focus item. */
    *, ::before, ::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --text-xs: 0.8125rem; --text-sm: 0.9375rem; --text-base: 1.0625rem; --text-lg: 1.25rem; --text-xl: 1.75rem;
      --space-1: 0.25rem; --space-2: 0.5rem; --space-3: 0.75rem; --space-4: 1rem; --space-5: 1.25rem; --space-6: 1.5rem; --space-8: 2rem;
      --radius-sm: 0.5rem; --radius-md: 0.75rem; --radius-lg: 1.125rem; --radius-xl: 1.5rem; --radius-full: 9999px;
      --font-body: 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      --transition: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --bg: #f1e7d3; --bg-end: #e6d3ad;
      --bg-grad: linear-gradient(180deg, #f7efdf 0%, #efe3c9 45%, #e6d3ad 100%);
      --surface: #ffffff; --surface-2: #fbfaf8; --surface-offset: #f4f2ee; --surface-dynamic: #ebe9e4; --glass: rgba(255,255,255,0.72);
      --border: rgba(18,18,18,0.08); --divider: rgba(18,18,18,0.08);
      --text: #121212; --text-muted: #55534f; --text-faint: #8f8d88; --text-inverse: #ffffff;
      --primary: #121212; --primary-hover: #2e2e2e; --primary-active: #000000; --primary-highlight: #d3f3ee;
      --accent: #1bbfa8; --accent-soft: #d3f3ee; --coral: #ef6461; --coral-soft: #fde3e1; --lavender-soft: #e8eafb;
      --ink: #1b1b1d; --ink-text: #f5f5f3; --ink-muted: rgba(245,245,243,0.62);
      --success: #0b7566; --success-bg: #d3f3ee; --error: #c4373a; --error-bg: #fde3e1; --warning: #8a5a00; --warning-bg: #fbefcc;
      --shadow-sm: 0 1px 2px rgba(18,18,18,0.05); --shadow-md: 0 6px 20px rgba(18,18,18,0.07); --shadow-lg: 0 16px 40px rgba(18,18,18,0.16);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #131315; --bg-end: #2b2418;
        --bg-grad: linear-gradient(180deg, #1d1c19 0%, #1f1c17 45%, #2b2418 100%);
        --surface: #212124; --surface-2: #252528; --surface-offset: #1b1b1e; --surface-dynamic: #2d2d31; --glass: rgba(42,42,46,0.72);
        --border: rgba(255,255,255,0.09); --divider: rgba(255,255,255,0.09);
        --text: #f2f2f0; --text-muted: #aaa9a4; --text-faint: #72716c; --text-inverse: #121212;
        --primary: #1bbfa8; --primary-hover: #55d8c5; --primary-active: #17a894; --primary-highlight: #133b36;
        --accent-soft: #133b36; --coral-soft: #4a2826; --lavender-soft: #262a44;
        --ink: #2b2b30; --ink-text: #f5f5f3;
        --success: #5fdcc9; --success-bg: #133b36; --error: #ff8a86; --error-bg: #4a2826; --warning: #f0c060; --warning-bg: #40341a;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 6px 20px rgba(0,0,0,0.35); --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
      }
    }
    :root[data-theme="dark"] {
        --bg: #131315; --bg-end: #2b2418;
        --bg-grad: linear-gradient(180deg, #1d1c19 0%, #1f1c17 45%, #2b2418 100%);
        --surface: #212124; --surface-2: #252528; --surface-offset: #1b1b1e; --surface-dynamic: #2d2d31; --glass: rgba(42,42,46,0.72);
        --border: rgba(255,255,255,0.09); --divider: rgba(255,255,255,0.09);
        --text: #f2f2f0; --text-muted: #aaa9a4; --text-faint: #72716c; --text-inverse: #121212;
        --primary: #1bbfa8; --primary-hover: #55d8c5; --primary-active: #17a894; --primary-highlight: #133b36;
        --accent-soft: #133b36; --coral-soft: #4a2826; --lavender-soft: #262a44;
        --ink: #2b2b30; --ink-text: #f5f5f3;
        --success: #5fdcc9; --success-bg: #133b36; --error: #ff8a86; --error-bg: #4a2826; --warning: #f0c060; --warning-bg: #40341a;
        --shadow-sm: 0 1px 2px rgba(0,0,0,0.3); --shadow-md: 0 6px 20px rgba(0,0,0,0.35); --shadow-lg: 0 16px 40px rgba(0,0,0,0.5);
    }
    html { -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
    body { min-height: 100dvh; font-family: var(--font-body); font-size: var(--text-base); color: var(--text); background: var(--bg); line-height: 1.5; }
    body::before { content: ''; position: fixed; inset: 0; z-index: -1; background: var(--bg-grad); }
    img { display: block; max-width: 100%; height: auto; }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    input, textarea, select { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
    .hidden { display: none !important; }

    /* HEADER — glass bar over the gradient, round icon buttons */
    header { position: sticky; top: 0; z-index: 50; padding: calc(env(safe-area-inset-top) + var(--space-2)) var(--space-4) var(--space-2);
      display: flex; align-items: center; gap: var(--space-2);
      background: color-mix(in srgb, var(--bg) 55%, transparent); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
    .hdr-title { flex: 1; min-width: 0; font-weight: 700; font-size: var(--text-base); letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-title span { font-weight: 800; }
    .btn-icon { display: inline-flex; align-items: center; justify-content: center; min-width: 44px; height: 44px; padding: 0 var(--space-3); border-radius: var(--radius-full);
      background: var(--glass); border: 1px solid var(--border); color: var(--text); font-size: 1.15rem; box-shadow: var(--shadow-sm); }
    .btn-icon:hover { background: var(--surface); }
    .btn-icon:disabled { opacity: 0.35; cursor: not-allowed; }
    .net-pill { font-size: var(--text-xs); font-weight: 650; padding: 4px 12px; border-radius: var(--radius-full); background: var(--coral); color: #fff; white-space: nowrap; }

    main { max-width: 46rem; margin: 0 auto; padding: var(--space-2) var(--space-4) calc(env(safe-area-inset-bottom) + 7rem); }

    /* TYPE */
    .hero { margin: var(--space-3) 0 var(--space-5); }
    .hero h1 { font-size: clamp(1.9rem, 1.4rem + 2.2vw, 2.5rem); font-weight: 750; letter-spacing: -0.035em; line-height: 1.08; }
    .hero p { color: var(--text-muted); margin-top: var(--space-2); font-size: var(--text-base); }
    .sec-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); margin: var(--space-6) 0 var(--space-3); }
    .sec-head h2 { font-size: 1.3rem; font-weight: 650; letter-spacing: -0.02em; }
    .lbl, .field label { display: block; font-size: var(--text-sm); font-weight: 650; color: var(--text-muted); margin-bottom: var(--space-2); }
    .hint { font-size: var(--text-sm); color: var(--text-muted); margin-top: var(--space-1); }

    /* BUTTONS — pills */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2); min-height: 48px; padding: var(--space-2) var(--space-5);
      border-radius: var(--radius-full); font-weight: 650; font-size: var(--text-sm); background: var(--surface); color: var(--text); border: 1px solid var(--border); box-shadow: var(--shadow-sm); }
    .btn:hover { background: var(--surface-2); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: var(--text-inverse); border-color: transparent; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--coral-soft); color: var(--error); border-color: transparent; }
    .btn-block { width: 100%; }
    .btn-lg { min-height: 58px; font-size: var(--text-base); }
    .btn-sm { min-height: 38px; padding: var(--space-1) var(--space-4); font-size: var(--text-sm); }
    .btn-row { display: flex; gap: var(--space-2); flex-wrap: wrap; }
    .btn-row > .btn { flex: 1; }
    .round { width: 44px; height: 44px; min-width: 44px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      background: var(--surface); border: 1px solid var(--border); color: var(--text); font-size: 1.1rem; flex-shrink: 0; }
    .round.light { background: #fff; color: #121212; border: none; width: 52px; height: 52px; }

    /* FORMS */
    .field { margin-bottom: var(--space-4); }
    .input { width: 100%; min-height: 48px; padding: var(--space-2) var(--space-4); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-md); font-size: 16px; }
    input[type="search"].input { border-radius: var(--radius-full); background: var(--glass); box-shadow: var(--shadow-sm); }
    textarea.input { resize: vertical; line-height: 1.5; }
    .input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px color-mix(in srgb, var(--primary) 18%, transparent); }

    /* LIST */
    .search-wrap { position: sticky; top: calc(env(safe-area-inset-top) + 60px); z-index: 10; padding: var(--space-1) 0 0; }
    .chips { display: flex; gap: var(--space-2); overflow-x: auto; padding: var(--space-3) 0 var(--space-2); scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; min-height: 40px; padding: var(--space-1) var(--space-4); border-radius: var(--radius-full); font-size: var(--text-sm); font-weight: 650;
      background: var(--glass); border: 1px solid var(--border); color: var(--text); }
    .chip.active { background: var(--primary); color: var(--text-inverse); border-color: transparent; }
    .card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl);
      padding: var(--space-4) var(--space-4); margin-bottom: var(--space-3); box-shadow: var(--shadow-md); color: inherit; text-decoration: none; }
    button.card:active, a.card:active { transform: scale(0.99); }
    .sop-card { display: flex; gap: var(--space-3); align-items: center; }
    .sc-icon { width: 52px; height: 52px; border-radius: 50%; background: var(--surface-offset); display: flex; align-items: center; justify-content: center; font-size: 1.55rem; flex-shrink: 0; }
    .sc-body { flex: 1; min-width: 0; }
    .card-title { font-weight: 650; font-size: var(--text-base); line-height: 1.3; }
    .card-note { font-size: var(--text-sm); color: var(--text-muted); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { display: flex; gap: var(--space-2); flex-wrap: wrap; margin-top: var(--space-2); font-size: var(--text-xs); color: var(--text-muted); align-items: center; }
    .badge { font-size: var(--text-xs); font-weight: 650; padding: 3px 11px; border-radius: var(--radius-full); background: var(--surface-dynamic); color: var(--text); white-space: nowrap; }
    .badge.Approved, .badge.Completed { background: var(--success-bg); color: var(--success); }
    .badge.Draft, .badge.Partial { background: var(--warning-bg); color: var(--warning); }
    .badge.InReview { background: var(--lavender-soft); color: var(--text); }
    .badge.Aborted, .badge.coral { background: var(--coral); color: #fff; }
    .badge.lime { background: var(--accent); color: #121212; }
    .empty { text-align: center; color: var(--text-muted); padding: var(--space-8) var(--space-4); }
    .banner { border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); font-size: var(--text-sm); display: flex; gap: var(--space-3); align-items: center; font-weight: 500; }
    .banner.warn { background: var(--warning-bg); color: var(--warning); }
    .banner.info { background: var(--lavender-soft); color: var(--text); }
    .banner .btn { min-height: 38px; margin-left: auto; flex-shrink: 0; }

    /* INK CARD — the one thing to act on now (unfinished run, run progress) */
    .ink-card { background: var(--ink); color: var(--ink-text); border-radius: var(--radius-xl); padding: var(--space-4) var(--space-5); box-shadow: var(--shadow-lg); margin-bottom: var(--space-3); }
    .ink-card .ink-top { display: flex; gap: var(--space-3); align-items: center; }
    .ink-card .ink-title { font-size: 1.2rem; font-weight: 650; line-height: 1.25; flex: 1; min-width: 0; }
    .ink-card .ink-sub { color: var(--ink-muted); font-size: var(--text-sm); margin-top: 2px; }
    .ink-track { height: 10px; border-radius: var(--radius-full); background: rgba(255,255,255,0.14); overflow: hidden; margin-top: var(--space-3); }
    .ink-fill { height: 100%; background: var(--accent); border-radius: var(--radius-full); transition: width 250ms; }

    .bottom-bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; padding: var(--space-4) var(--space-4) calc(env(safe-area-inset-bottom) + var(--space-3));
      background: linear-gradient(to top, var(--bg-end) 55%, transparent); }
    .bottom-bar > div { max-width: 46rem; margin: 0 auto; }
    .bottom-bar .btn { box-shadow: var(--shadow-lg); }

    /* SOP CONTENT (rendered Notion blocks) */
    .sop-head h1 { font-size: clamp(1.75rem, 1.3rem + 2vw, 2.25rem); font-weight: 750; line-height: 1.12; letter-spacing: -0.03em; margin: var(--space-2) 0 var(--space-3); }
    .sop-head .note { color: var(--text-muted); font-size: var(--text-base); margin-top: var(--space-3); }
    #view > .doc { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: var(--space-5) var(--space-5); box-shadow: var(--shadow-md); }
    .doc { margin-top: var(--space-4); overflow-wrap: anywhere; line-height: 1.6; }
    .doc > * + * { margin-top: var(--space-3); }
    .doc > :first-child { margin-top: 0; }
    .doc h2 { font-size: 1.35rem; margin-top: var(--space-6); line-height: 1.25; letter-spacing: -0.02em; }
    .doc h3 { font-size: 1.15rem; margin-top: var(--space-5); }
    .doc h4 { font-size: 1.02rem; margin-top: var(--space-4); }
    .doc ul, .doc ol { padding-left: 1.5rem; }
    .doc li + li { margin-top: var(--space-2); }
    .doc li::marker { font-weight: 700; }
    .doc li > .kids { margin-top: var(--space-1); }
    .doc .todo { display: flex; gap: var(--space-2); align-items: flex-start; }
    .doc .todo .box { flex-shrink: 0; width: 1.15rem; height: 1.15rem; margin-top: 0.25rem; border: 2px solid var(--text-faint); border-radius: 6px; }
    .doc .todo .box.on { background: var(--accent); border-color: var(--accent); }
    .doc .callout { display: flex; gap: var(--space-3); background: var(--lavender-soft); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); }
    .doc .callout.warn { background: var(--coral-soft); }
    .doc .callout .ic { font-size: 1.25rem; line-height: 1.4; }
    .doc .callout > div > * + * { margin-top: var(--space-2); }
    .doc blockquote { border-left: 3px solid var(--text); padding-left: var(--space-3); color: var(--text-muted); }
    .doc hr { border: none; border-top: 1px solid var(--divider); margin: var(--space-5) 0; }
    .doc code { font-family: ui-monospace, Consolas, monospace; font-size: 0.9em; background: var(--surface-dynamic); padding: 1px 6px; border-radius: 6px; }
    .doc pre { background: var(--surface-dynamic); padding: var(--space-3); border-radius: var(--radius-md); overflow-x: auto; font-size: var(--text-sm); }
    .doc a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }
    .doc figure img { border-radius: var(--radius-lg); }
    .doc figcaption { font-size: var(--text-xs); color: var(--text-muted); margin-top: var(--space-1); }
    .doc .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: var(--radius-md); }
    .doc table { border-collapse: collapse; width: 100%; font-size: var(--text-sm); }
    .doc td { border: 1px solid var(--border); padding: var(--space-2) var(--space-3); vertical-align: top; min-width: 7rem; }
    .doc tr.th td { font-weight: 650; background: var(--surface-offset); }
    .doc details summary { cursor: pointer; font-weight: 600; }
    .doc details > .kids { margin-top: var(--space-2); padding-left: var(--space-4); }
    .doc .unsupported { font-size: var(--text-xs); color: var(--text-faint); font-style: italic; }
    .c-red { color: #d44c47; } .c-blue { color: #337ea9; } .c-green { color: #448361; } .c-orange { color: #d9730d; } .c-purple { color: #9065b0; } .c-gray { color: var(--text-muted); } .c-yellow { color: #cb912f; } .c-pink { color: #c14c8a; } .c-brown { color: #9f6b53; }

    /* RUN MODE — ink progress card, big step cards, lime when done */
    .progress { position: sticky; top: calc(env(safe-area-inset-top) + 60px); z-index: 10; margin: var(--space-2) 0 var(--space-3);
      background: var(--ink); color: var(--ink-text); border-radius: var(--radius-xl); padding: var(--space-3) var(--space-5) var(--space-4); box-shadow: var(--shadow-lg); }
    .progress-track { height: 10px; background: rgba(255,255,255,0.14); border-radius: var(--radius-full); overflow: hidden; margin-top: var(--space-2); order: 2; }
    .progress-fill { height: 100%; background: var(--accent); border-radius: var(--radius-full); transition: width 250ms; }
    .progress { display: flex; flex-direction: column; }
    .progress-label { display: flex; justify-content: space-between; align-items: baseline; gap: var(--space-2); order: 1; }
    .progress-label span:first-child { font-size: 1.35rem; font-weight: 750; letter-spacing: -0.02em; }
    .progress-label span:last-child { font-size: var(--text-xs); color: var(--ink-muted); text-align: right; }
    .run-section { font-size: 1.25rem; font-weight: 700; letter-spacing: -0.02em; margin: var(--space-6) 0 var(--space-3); }
    .step { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); margin-bottom: var(--space-3); overflow: hidden; box-shadow: var(--shadow-md); transition: background var(--transition); }
    .step.done { background: var(--accent); border-color: transparent; color: #121212; }
    .step-main { display: flex; gap: var(--space-3); width: 100%; text-align: left; padding: var(--space-4) var(--space-4); min-height: 64px; align-items: flex-start; font-size: var(--text-base); line-height: 1.45; }
    .step-check { flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%; border: 2.5px solid var(--text-faint); display: flex; align-items: center; justify-content: center; font-weight: 800; color: transparent; }
    .step.done .step-check { background: #121212; border-color: #121212; color: var(--accent); }
    .step-num { font-weight: 800; margin-right: 2px; }
    .step-time { font-size: var(--text-xs); font-weight: 700; margin-top: var(--space-1); color: rgba(18,18,18,0.7); }
    .step-extra { padding: 0 var(--space-4) var(--space-4) calc(var(--space-4) + 34px + var(--space-3)); }
    .step-extra .doc { margin-top: 0; font-size: var(--text-sm); }
    .step.done .step-extra .doc, .step.done .step-extra .doc * { color: #121212; }
    .step-tools { display: flex; gap: var(--space-2); margin-top: var(--space-2); }
    .step.done .step-tools .btn { background: rgba(255,255,255,0.55); color: #121212; border-color: transparent; }
    .step-note { margin-top: var(--space-2); }
    .info-card { display: flex; gap: var(--space-3); background: var(--coral-soft); color: var(--text); border-radius: var(--radius-lg); padding: var(--space-3) var(--space-4); margin-bottom: var(--space-3); font-size: var(--text-sm); font-weight: 500; }
    .info-card.soft { background: var(--lavender-soft); }

    /* EDITOR */
    .ed-item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: var(--space-2) var(--space-3); margin-bottom: var(--space-2); box-shadow: var(--shadow-sm); }
    .ed-item.changed { box-shadow: inset 4px 0 0 var(--primary), var(--shadow-sm); }
    .ed-item.locked { background: var(--surface-offset); }
    .ed-bar { display: flex; gap: var(--space-1); align-items: center; margin-bottom: var(--space-1); }
    .ed-bar select { min-height: 34px; padding: 0 var(--space-2); font-size: var(--text-xs); font-weight: 650; background: var(--surface-offset); border: 1px solid var(--border); border-radius: var(--radius-full); color: var(--text); max-width: 11rem; }
    .ed-bar .sp { flex: 1; }
    .ed-bar .btn-icon { min-width: 34px; height: 34px; padding: 0; font-size: 0.95rem; box-shadow: none; }
    .ed-text { width: 100%; border: none; background: transparent; resize: none; font-size: 16px; line-height: 1.45; padding: var(--space-1) 0; min-height: 2.2em; overflow: hidden; }
    .ed-text:focus { outline: none; }

<body>

  </header>

  <main id="view"></main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
// ─── CONFIG ──────────────────────────────────────────────────
const APP_VERSION = '0.2.0';
// Same Cloudflare Worker as Brain+: it injects the Notion token and Groq key
// and gates every call on X-App-Password. No secrets live in this file.
const PROXY = 'https://notion-proxy.francesco-955.workers.dev';
const NOTION_VERSION = '2022-06-28';                    // the Worker forces this anyway
const SOP_DB = '3581301d4ab8819693a1e1d1f958e6d6';      // Naked Farm / Brain+ / 📋 SoP
const RUNS_DB = '2bb3587c362a490882496c3967dda7db';     // Naked Farm / Brain+ / SOP Runs
const CATEGORIES = ['Field Ops', 'Safety', 'Hardware', 'Software'];
const STATUSES = ['Draft', 'In Review', 'Approved', 'Archived'];
// Groq retires models and the old id then hard-fails — check
// https://console.groq.com/docs/deprecations first if AI import breaks.
const AI_MODEL = 'openai/gpt-oss-20b';
const AI_MAX_INPUT_CHARS = 14000;   // free tier ≈ 8K tokens/min: bigger docs get a 413/429
const NOTION_SINGLE_PART_LIMIT = 20 * 1024 * 1024;
// Inside Naked Brain (SoP tab) this app runs in a same-origin iframe: it reuses
// Naked Brain's login and follows its light/dark setting (default light).
const EMBED = window.self !== window.top || new URLSearchParams(location.search).has('embed');
const PW_KEY = EMBED ? 'brainplus_pw' : 'sopapp_pw', OPERATOR_KEY = 'sopapp_operator', RUN_KEY = 'sopapp_run';
// Naked Brain's author name (Settings / header button), same origin storage.
function authorName() {
  try { return (JSON.parse(localStorage.getItem('ugly200_config') || '{}').authorName || '').trim(); }
  catch (_) { return ''; }
}
function applyTheme() {
  const choice = localStorage.getItem('ugly200_theme') || 'light';
  if (choice === 'light' || choice === 'dark') document.documentElement.setAttribute('data-theme', choice);
  else document.documentElement.removeAttribute('data-theme');
}
applyTheme();
window.addEventListener('storage', e => { if (e.key === 'ugly200_theme') applyTheme(); });

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');

// ─── SMALL HELPERS ───────────────────────────────────────────
const $ = id => document.getElementById(id);
// Build DOM with createElement/textContent only — never innerHTML with
// Notion text (Brain+ v1.49: injected markup executed and "<B2>" vanished).
function el(tag, attrs, ...kids) {
  const e = document.createElement(tag);
  if (attrs) for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'text') e.textContent = v;
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) e.append(k instanceof Node ? k : String(k));
  return e;
}
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
const plain = rt => (rt || []).map(t => t.plain_text ?? t.text?.content ?? '').join('');
const fmtTime = iso => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const fmtDate = iso => new Date(iso).toLocaleDateString([], { day: 'numeric', month: 'short', year: 'numeric' });
const safeUrl = u => (/^https?:\/\//i.test(u || '') ? u : null);
function lsGet(k, fb = null) { try { const v = localStorage.getItem(k); return v == null ? fb : JSON.parse(v); } catch (_) { return fb; } }
function lsSet(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} }

let toastTimer = null;
function toast(msg, type = 'info', ms = 3500) {
  const t = $('toast');
  t.textContent = msg;
  t.className = `toast ${type} show`;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// Failed response → a short, true reason. Notion/Groq send {message} or {error:{message}}.
async function apiErrorMessage(res) {
  let detail = '';
  try {
    const body = await res.text();
    try { const j = JSON.parse(body); detail = j?.message || j?.error?.message || ''; }
    catch (_) { detail = body.trim(); }
  } catch (_) {}
  if (res.status === 429) return 'rate limit reached — wait a minute and retry';
  if (res.status === 413) return 'document too large for the AI — use "Import as-is"';
  const base = detail || `HTTP ${res.status}`;
  return base.length > 140 ? base.slice(0, 137) + '…' : base;
}
function failureReason(e) {
  if (e?.name === 'AbortError') return 'timed out — connection too slow';
  if (e instanceof TypeError) return 'cannot reach the server — check your connection';
  const msg = e?.message || 'unknown error';
  return msg.length > 140 ? msg.slice(0, 137) + '…' : msg;
}
const isNetworkError = e => e instanceof TypeError || e?.name === 'AbortError';

// ─── PASSWORD GATE + WORKER FETCH ────────────────────────────
const getPw = () => localStorage.getItem(PW_KEY) || '';
function showGate() { $('gate').classList.remove('hidden'); setTimeout(() => $('gatePw').focus(), 50); }

async function tryUnlock() {
  const pw = $('gatePw').value, err = $('gateErr'), btn = $('gateBtn');
  if (!pw) return;
  btn.disabled = true; btn.textContent = 'Checking…'; err.classList.add('hidden');
  try {
    const res = await fetch(PROXY + '/ping', { headers: { 'X-App-Password': pw } });
    if (res.ok) {
      localStorage.setItem(PW_KEY, pw);
      $('gate').classList.add('hidden');
      route();
    } else {
      err.textContent = 'Wrong password — try again.';
      err.classList.remove('hidden');
      $('gatePw').value = '';
    }
  } catch (_) {
    err.textContent = 'Connection error — check your network.';
    err.classList.remove('hidden');
  } finally {
    btn.disabled = false; btn.textContent = 'Unlock';
  }
}

// Every Worker call: injects the password, honours the caller's abort signal
// alongside a hard 2-minute cap (iOS otherwise hangs forever on dead sockets).
async function cfFetch(url, options = {}) {
  const headers = new Headers(options.headers || {});
  headers.set('X-App-Password', getPw());
  const controller = new AbortController();
  const tid = setTimeout(() => controller.abort(), 120000);
  const outer = options.signal;
  let signal = controller.signal, onOuter = null;
  if (outer) {
    if (typeof AbortSignal.any === 'function') signal = AbortSignal.any([outer, controller.signal]);
    else if (outer.aborted) controller.abort();
    else { onOuter = () => controller.abort(); outer.addEventListener('abort', onOuter, { once: true }); }
  }
  try {
    const res = await fetch(url, { ...options, headers, signal });
    if (res.status === 401) {
      localStorage.removeItem(PW_KEY);
      showGate();
      throw new Error('Session expired — please re-enter the password.');
    }
    return res;
  } finally {
    clearTimeout(tid);
    if (onOuter) outer.removeEventListener('abort', onOuter);
  }
}

// Notion REST call through the Worker. Throws Error(reason) on non-2xx.
async function notion(path, method = 'GET', body) {
  const opts = { method, headers: { 'Notion-Version': NOTION_VERSION } };
  if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
  const res = await cfFetch(PROXY + '/v1/' + path, opts);
  if (!res.ok) {
    const e = new Error(await apiErrorMessage(res));
    e.status = res.status;
    throw e;
  }
  return res.status === 204 ? null : res.json();
}

// ─── INDEXEDDB (offline copies + outbox) ─────────────────────
let _db = null;
function idb() {
  if (_db) return _db;
  _db = new Promise((resolve, reject) => {
    const req = indexedDB.open('sopapp', 1);
    req.onupgradeneeded = () => req.result.createObjectStore('kv');
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _db;
}
async function idbGet(key) {
  try {
    const db = await idb();
    return await new Promise((res, rej) => {
      const r = db.transaction('kv').objectStore('kv').get(key);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch (e) { console.warn('idbGet', key, e); return undefined; }
}
async function idbSet(key, val) {
  try {
    const db = await idb();
    await new Promise((res, rej) => {
      const tx = db.transaction('kv', 'readwrite');
      val === undefined ? tx.objectStore('kv').delete(key) : tx.objectStore('kv').put(val, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) { console.warn('idbSet', key, e); }
}

// ─── NOTION DATA ─────────────────────────────────────────────
function sopProps(page) {
  const p = page.properties || {};
  return {
    id: page.id.replace(/-/g, ''),
    title: plain(p.Title?.title) || 'Untitled',
    category: p.Category?.select?.name || '',
    status: p.Status?.select?.name || '',
    note: plain(p.Summary?.rich_text) || plain(p.Note?.rich_text),
    date: p['Effective Date']?.date?.start || p.Date?.date?.start || '',
    docType: p['Document Type']?.select?.name || '',
    icon: page.icon?.type === 'emoji' ? page.icon.emoji : '',
    url: page.url,
    edited: page.last_edited_time,
  };
}

async function mapLimit(items, limit, fn) {
  const out = new Array(items.length);
  let i = 0;
  const worker = async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } };
  await Promise.all(Array.from({ length: Math.min(limit, items.length) }, worker));
  return out;
}

// All SOPs except archived ones. Falls back to the offline copy on network failure.
async function loadSops({ force = false } = {}) {
  const cached = await idbGet('sops');
  if (cached && !force && Date.now() - cached.at < 60_000) return { list: cached.list, at: cached.at, offline: false };
  try {
    const list = [];
    let cursor;
    do {
      const r = await notion(`databases/${SOP_DB}/query`, 'POST', {
        page_size: 100, start_cursor: cursor,
        filter: { property: 'Status', select: { does_not_equal: 'Archived' } },
        sorts: [{ property: 'Title', direction: 'ascending' }],
      });
      list.push(...r.results.map(sopProps));
      cursor = r.has_more ? r.next_cursor : undefined;
    } while (cursor);
    const at = Date.now();
    await idbSet('sops', { list, at });
    return { list, at, offline: false };
  } catch (e) {
    if (cached && isNetworkError(e)) return { list: cached.list, at: cached.at, offline: true };
    throw e;
  }
}

const NO_DESCEND = new Set(['child_page', 'child_database', 'unsupported']);
async function fetchChildren(blockId, depth = 0) {
  const blocks = [];
  let cursor;
  do {
    const q = cursor ? `?page_size=100&start_cursor=${cursor}` : '?page_size=100';
    const r = await notion(`blocks/${blockId}/children${q}`);
    blocks.push(...r.results);
    cursor = r.has_more ? r.next_cursor : undefined;
  } while (cursor);
  if (depth < 4) {
    await mapLimit(blocks.filter(b => b.has_children && !NO_DESCEND.has(b.type)), 3, async b => {
      b.children = await fetchChildren(b.id, depth + 1);
    });
  }
  return blocks;
}

// One SOP = its page (properties) + its block tree. Cached for offline reading.
async function loadSop(id, { force = false } = {}) {
  const key = 'sop:' + id;
  const cached = await idbGet(key);
  if (cached && !force && Date.now() - cached.at < 60_000) return { ...cached, offline: false };
  try {
    const [page, blocks] = await Promise.all([notion(`pages/${id}`), fetchChildren(id)]);
    const data = { page, blocks, at: Date.now() };
    await idbSet(key, data);
    cacheImages(blocks);
    return { ...data, offline: false };
  } catch (e) {
    if (cached && isNetworkError(e)) return { ...cached, offline: true };
    throw e;
  }
}

// Notion image URLs are signed and expire after ~1 h, so keep a blob copy for
// offline use. Works only if the file host allows CORS; otherwise silently skipped.
function walkBlocks(blocks, fn) { for (const b of blocks || []) { fn(b); walkBlocks(b.children, fn); } }
function imageUrl(b) { const im = b.image; return im?.type === 'external' ? im.external.url : im?.file?.url; }
async function cacheImages(blocks) {
  const imgs = [];
  walkBlocks(blocks, b => { if (b.type === 'image') imgs.push(b); });
  await mapLimit(imgs, 2, async b => {
    if (await idbGet('img:' + b.id)) return;
    try {
      const r = await fetch(imageUrl(b), { mode: 'cors' });
      if (r.ok) await idbSet('img:' + b.id, await r.blob());
    } catch (_) {}
  });
}

// ─── RENDERING NOTION BLOCKS ─────────────────────────────────
function renderRich(rt) {
  const frag = document.createDocumentFragment();
  for (const t of rt || []) {
    const a = t.annotations || {};
    let node = document.createTextNode(t.plain_text ?? t.text?.content ?? '');
    const href = safeUrl(t.href || t.text?.link?.url);
    if (a.code) node = el('code', null, node);
    if (a.bold) node = el('strong', null, node);
    if (a.italic) node = el('em', null, node);
    if (a.strikethrough) node = el('s', null, node);
    if (a.underline) node = el('u', null, node);
    if (a.color && a.color !== 'default' && !a.color.endsWith('_background')) node = el('span', { class: 'c-' + a.color }, node);
    if (href) node = el('a', { href, target: '_blank', rel: 'noopener' }, node);
    frag.append(node);
  }
  return frag;
}

const LIST_TYPES = { bulleted_list_item: 'ul', numbered_list_item: 'ol' };
function renderBlocks(blocks) {
  const frag = document.createDocumentFragment();
  let list = null, listType = null;
  for (const b of blocks || []) {
    const lt = LIST_TYPES[b.type];
    if (lt) {
      if (listType !== lt) { list = el(lt); frag.append(list); listType = lt; }
      const li = el('li', null, renderRich(b[b.type].rich_text));
      if (b.children?.length) li.append(el('div', { class: 'kids' }, renderBlocks(b.children)));
      list.append(li);
      continue;
    }
    list = null; listType = null;
    const node = renderBlock(b);
    if (node) frag.append(node);
  }
  return frag;
}

const WARN_ICONS = new Set(['⚠️', '⚠', '🚫', '⛔', '❗', '‼️', '🔥', '☠️', '🧤', '🥽', '🔪']);
function renderBlock(b) {
  const d = b[b.type] || {};
  const kids = () => (b.children?.length ? el('div', { class: 'kids' }, renderBlocks(b.children)) : null);
  switch (b.type) {
    case 'paragraph': return plain(d.rich_text) ? el('div', null, el('p', null, renderRich(d.rich_text)), kids()) : null;
    case 'heading_1': return el('h2', null, renderRich(d.rich_text));
    case 'heading_2': return el('h3', null, renderRich(d.rich_text));
    case 'heading_3': return el('h4', null, renderRich(d.rich_text));
    case 'to_do': return el('div', null,
      el('div', { class: 'todo' }, el('span', { class: 'box' + (d.checked ? ' on' : '') }), el('span', null, renderRich(d.rich_text))), kids());
    case 'callout': return el('div', { class: 'callout' + (WARN_ICONS.has(d.icon?.emoji) ? ' warn' : '') },
      el('span', { class: 'ic', 'aria-hidden': 'true' }, d.icon?.emoji || '💡'),
      el('div', null, el('div', null, renderRich(d.rich_text)), b.children?.length ? renderBlocks(b.children) : null));
    case 'quote': return el('blockquote', null, renderRich(d.rich_text), kids());
    case 'divider': return el('hr');
    case 'code': return el('pre', null, el('code', null, plain(d.rich_text)));
    case 'toggle': return el('details', null, el('summary', null, renderRich(d.rich_text)), kids());
    case 'image': {
      const img = el('img', { src: imageUrl(b), alt: plain(d.caption) || 'SOP photo', loading: 'lazy' });
      img.addEventListener('error', async () => {
        const blob = await idbGet('img:' + b.id);
        if (blob && !img.dataset.fb) { img.dataset.fb = '1'; img.src = URL.createObjectURL(blob); }
      }, { once: true });
      return el('figure', null, img, d.caption?.length ? el('figcaption', null, renderRich(d.caption)) : null);
    }
    case 'table': {
      const rows = (b.children || []).filter(r => r.type === 'table_row');
      const tbl = el('table');
      rows.forEach((r, i) => tbl.append(el('tr', { class: i === 0 && d.has_column_header ? 'th' : null },
        r.table_row.cells.map(c => el('td', null, renderRich(c))))));
      return el('div', { class: 'tbl-wrap' }, tbl);
    }
    case 'column_list': case 'column': case 'synced_block': return el('div', null, renderBlocks(b.children));
    case 'bookmark': case 'embed': case 'link_preview': {
      const u = safeUrl(d.url);
      return u ? el('p', null, el('a', { href: u, target: '_blank', rel: 'noopener' }, plain(d.caption) || u)) : null;
    }
    case 'video': case 'file': case 'pdf': case 'audio': {
      const u = safeUrl(d.type === 'external' ? d.external?.url : d.file?.url);
      const name = d.name || plain(d.caption) || b.type;
      return u ? el('p', null, el('a', { href: u, target: '_blank', rel: 'noopener' }, '📎 ' + name)) : null;
    }
    case 'child_page': return el('p', { class: 'unsupported' }, '📄 Sub-page: ' + (d.title || ''));
    case 'child_database': return el('p', { class: 'unsupported' }, '🗂 Database: ' + (d.title || ''));
    default: return el('p', { class: 'unsupported' }, `[${b.type.replace(/_/g, ' ')} — open in Notion to see it]`);
  }
}

// ─── ROUTER + CHROME ─────────────────────────────────────────
// Hash routes so iOS swipe-back and the Android back button just work:
//   #/  #/sop/ID  #/run/ID  #/edit/ID  #/new  #/import  #/runs
let leaveGuard = null;   // editor sets this to warn about unsaved changes
function go(hash) { location.hash = hash; }
function setHeader(title, back) {
  const t = $('hdrTitle');
  t.textContent = '';
  if (title) t.textContent = title; else if (EMBED) t.textContent = 'Procedures';
  else t.append('FarmBox ', el('span', null, 'SOP'));
  $('backBtn').classList.toggle('hidden', !back);
}
function view(...nodes) { const v = $('view'); v.replaceChildren(...nodes.flat().filter(n => n != null && n !== false)); window.scrollTo(0, 0); return v; }
function loadingView(msg = 'Loading…') { view(el('div', { class: 'loading' }, el('span', { class: 'spinner' }), msg)); }
function errorView(msg, retry) {
  view(el('div', { class: 'empty' }, el('p', { text: '⚠️ ' + msg }),
    retry ? el('button', { class: 'btn', style: 'margin-top:1rem', onclick: retry }, 'Try again') : null));
}

let shownHash = null;
async function route() {
  if (!getPw()) { showGate(); return; }
  if (leaveGuard && location.hash !== shownHash) {
    if (leaveGuard() && !confirm('Discard unsaved changes?')) { history.pushState(null, '', shownHash); return; }
    leaveGuard = null;
  }
  shownHash = location.hash;
  const [, r, id] = (location.hash.replace(/^#\/?/, '') || '').match(/^([^/]*)\/?(.*)$/) || [];
  document.querySelector('.bottom-bar')?.remove();
  try {
    if (r === 'sop' && id) await showSop(id);
    else if (r === 'run' && id) await showRun(id);
    else if (r === 'edit' && id) await showEditor(id);
    else if (r === 'new') await showEditor(null);
    else if (r === 'import') showImport();
    else if (r === 'runs') await showRuns();
    else await showList();
  } catch (e) {
    console.warn(e);
    errorView(failureReason(e), route);
  }
}
window.addEventListener('hashchange', route);
$('backBtn').addEventListener('click', () => (history.length > 1 ? history.back() : go('#/')));

function bottomBar(...kids) {
  document.querySelector('.bottom-bar')?.remove();
  document.body.append(el('div', { class: 'bottom-bar' }, el('div', { class: 'btn-row' }, kids)));
}

function sheet(title, text, ...content) {
  const ov = el('div', { class: 'overlay', onclick: e => { if (e.target === ov) ov.remove(); } },
    el('div', { class: 'sheet', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('h2', null, title), text ? el('p', null, text) : null, ...content));
  document.body.append(ov);
  return ov;
}
function confirmSheet(title, text, okLabel, danger = false) {
  return new Promise(resolve => {
    let ov;
    const done = v => { ov.remove(); resolve(v); };
    ov = sheet(title, text, el('div', { class: 'btn-row' },
      el('button', { class: 'btn', onclick: () => done(false) }, 'Cancel'),
      el('button', { class: 'btn ' + (danger ? 'btn-danger' : 'btn-primary'), onclick: () => done(true) }, okLabel)));
  });
}

// ─── CHECKLIST STEPS ─────────────────────────────────────────
// Numbered items and to-dos become checkable steps, grouped under the nearest
// heading; callouts become info cards (safety notes etc.). Pages with neither
// numbered items nor to-dos fall back to bullets. Works on existing SOP pages
// as-is — no special format required.
const STEP_CONTAINERS = new Set(['toggle', 'column_list', 'column', 'synced_block']);
function extractSteps(blocks) {
  const collect = stepTypes => {
    const out = [];
    const walk = list => {
      for (const b of list || []) {
        const d = b[b.type] || {};
        if (/^heading_/.test(b.type)) out.push({ kind: 'section', text: plain(d.rich_text) });
        else if (stepTypes.has(b.type)) out.push({ kind: 'step', key: b.id, text: plain(d.rich_text) });
        else if (b.type === 'callout') { out.push({ kind: 'info', icon: d.icon?.emoji || '💡', text: plain(d.rich_text) }); walk(b.children); }
        else if (STEP_CONTAINERS.has(b.type)) walk(b.children);
      }
    };
    walk(blocks);
    return out;
  };
  let items = collect(new Set(['numbered_list_item', 'to_do']));
  if (!items.some(i => i.kind === 'step')) items = collect(new Set(['bulleted_list_item']));
  // Keep a section (and its info cards) only if a step follows before the next
  // section — drops "References", "Scope" etc. from the checklist.
  const out = [];
  let pending = [];
  for (const it of items) {
    if (it.kind === 'section') pending = [it];
    else if (it.kind === 'info') pending.push(it);
    else { out.push(...pending, it); pending = []; }
  }
  return out;
}

// ─── RUN MODE ────────────────────────────────────────────────
// Run state lives in localStorage and is written on every tap: iOS kills
// backgrounded PWAs without warning and a half-done checklist must survive it.
const saveRun = st => lsSet(RUN_KEY, st);

async function showRun(id) {
  setHeader('Checklist', true);
  let st = lsGet(RUN_KEY);
  if (st && st.sopId !== id) {
    const discard = await confirmSheet('Unfinished checklist',
      `"${st.sopTitle}" is still in progress. Discard it and start this one?`, 'Discard it', true);
    if (!discard) { go('#/run/' + st.sopId); return; }
    st = null; saveRun(null);
  }
  loadingView();
  const data = await loadSop(id);
  const sop = sopProps(data.page);
  const byId = new Map();
  walkBlocks(data.blocks, b => byId.set(b.id, b));

  if (!st) {
    const items = extractSteps(data.blocks);
    const name = authorName() || await askOperator();   // prompt only as a last resort
    if (!name) { history.back(); return; }
    st = { runId: uid(), sopId: id, sopTitle: sop.title, operator: name, startedAt: new Date().toISOString(),
      items, state: {}, notes: '' };
    saveRun(st);
  }
  setHeader(st.sopTitle, true);
  drawRun(st, byId);
}

function askOperator() {
  return new Promise(resolve => {
    const inp = el('input', { class: 'input', placeholder: 'Your name', value: lsGet(OPERATOR_KEY, ''), autocomplete: 'name', 'aria-label': 'Your name' });
    let ov;
    const start = () => {
      const v = inp.value.trim();
      if (!v) { inp.focus(); return; }
      lsSet(OPERATOR_KEY, v); ov.remove(); resolve(v);
    };
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
    ov = sheet('Start checklist', 'Who is doing this procedure? Your name goes on the completion record.',
      el('div', { class: 'field' }, inp),
      el('div', { class: 'btn-row' },
        el('button', { class: 'btn', onclick: () => { ov.remove(); resolve(null); } }, 'Cancel'),
        el('button', { class: 'btn btn-primary', onclick: start }, 'Start')));
    setTimeout(() => inp.focus(), 50);
  });
}

function drawRun(st, byId) {
  const steps = st.items.filter(i => i.kind === 'step');
  const fill = el('div', { class: 'progress-fill' });
  const label = el('div', { class: 'progress-label' });
  const updateProgress = () => {
    const done = steps.filter(s => st.state[s.key]?.done).length;
    fill.style.width = (steps.length ? (100 * done / steps.length) : 0) + '%';
    label.replaceChildren(el('span', null, `${done} / ${steps.length} steps`), el('span', null, `${st.operator} · started ${fmtTime(st.startedAt)}`));
  };

  let n = 0;
  const nodes = st.items.map(it => {
    if (it.kind === 'section') return el('div', { class: 'run-section', text: it.text });
    if (it.kind === 'info') return el('div', { class: 'info-card' + (WARN_ICONS.has(it.icon) ? '' : ' soft') }, el('span', { 'aria-hidden': 'true' }, it.icon), el('span', { text: it.text }));
    const num = ++n;
    const s = () => (st.state[it.key] ||= { done: false, note: '' });
    const card = el('div', { class: 'step' });
    const time = el('div', { class: 'step-time' });
    const noteBox = el('textarea', { class: 'input step-note hidden', rows: 2, placeholder: 'Note for this step (optional)', 'aria-label': `Note for step ${num}` });
    const block = byId.get(it.key);
    const refresh = () => {
      const cur = st.state[it.key];
      card.classList.toggle('done', !!cur?.done);
      mainBtn.setAttribute('aria-pressed', String(!!cur?.done));
      time.textContent = cur?.done ? '✓ ' + fmtTime(cur.doneAt) : '';
      noteBtn.textContent = cur?.note ? '📝 Edit note' : '📝 Add note';
    };
    const mainBtn = el('button', { class: 'step-main', onclick: () => {
      const cur = s();
      cur.done = !cur.done; cur.doneAt = cur.done ? new Date().toISOString() : null;
      saveRun(st); refresh(); updateProgress();
      if (cur.done && navigator.vibrate) navigator.vibrate(15);
    } },
      el('span', { class: 'step-check', 'aria-hidden': 'true' }, '✓'),
      el('span', null, el('span', { class: 'step-text' }, el('span', { class: 'step-num' }, num + '.'), ' ',
        block ? renderRich(block[block.type].rich_text) : it.text), time));
    const noteBtn = el('button', { class: 'btn btn-sm', onclick: () => { noteBox.classList.toggle('hidden'); if (!noteBox.classList.contains('hidden')) noteBox.focus(); } });
    noteBox.value = st.state[it.key]?.note || '';
    if (noteBox.value) noteBox.classList.remove('hidden');
    noteBox.addEventListener('input', () => { s().note = noteBox.value; saveRun(st); refresh(); });
    card.append(mainBtn, el('div', { class: 'step-extra' },
      block?.children?.length ? el('div', { class: 'doc' }, renderBlocks(block.children)) : null,
      el('div', { class: 'step-tools' }, noteBtn), noteBox));
    refresh();
    return card;
  });

  updateProgress();
  view(el('div', { class: 'progress' }, el('div', { class: 'progress-track' }, fill), label), ...nodes);
  bottomBar(
    el('button', { class: 'btn btn-lg', onclick: () => abortRun(st) }, 'Stop'),
    el('button', { class: 'btn btn-primary btn-lg', onclick: () => finishRun(st) }, 'Finish ✓'));
}

function finishRun(st) {
  const steps = st.items.filter(i => i.kind === 'step');
  const done = steps.filter(s => st.state[s.key]?.done).length;
  const notes = el('textarea', { class: 'input', rows: 3, placeholder: 'Anything to report? (optional)', 'aria-label': 'Run notes' });
  notes.value = st.notes || '';
  const status = done === steps.length ? 'Completed' : 'Partial';
  let ov;
  ov = sheet(done === steps.length ? 'All steps done 🎉' : `${done} of ${steps.length} steps done`,
    done === steps.length ? 'This run will be logged as Completed.' : 'Unticked steps will be logged as not done (status: Partial).',
    el('div', { class: 'field' }, el('label', null, 'Notes'), notes),
    el('div', { class: 'btn-row' },
      el('button', { class: 'btn', onclick: () => ov.remove() }, 'Back'),
      el('button', { class: 'btn btn-primary', onclick: () => { st.notes = notes.value.trim(); ov.remove(); logRun(st, status); } }, 'Save run')));
}

function abortRun(st) {
  let ov;
  ov = sheet('Stop this checklist?', 'You can log what was done so far as an aborted run, or throw it away.',
    el('div', { class: 'btn-row', style: 'flex-direction:column' },
      el('button', { class: 'btn btn-block', onclick: () => { ov.remove(); logRun(st, 'Aborted'); } }, 'Log as aborted'),
      el('button', { class: 'btn btn-danger btn-block', onclick: () => { ov.remove(); saveRun(null); toast('Checklist discarded'); go('#/sop/' + st.sopId); } }, 'Discard, don\'t log'),
      el('button', { class: 'btn btn-block', onclick: () => ov.remove() }, 'Keep going')));
}

async function logRun(st, status) {
  const rec = { ...st, status, finishedAt: new Date().toISOString() };
  const box = (await idbGet('outbox')) || [];
  box.push(rec);
  await idbSet('outbox', box);
  saveRun(null);
  go('#/sop/' + st.sopId);
  const n = await syncOutbox();
  if (n > 0) toast('Run saved to Notion ✓', 'success');
  else toast('Saved on this phone — will upload when back online', 'info', 5000);
}

// ─── OUTBOX → NOTION "SOP Runs" ──────────────────────────────
let syncing = false;
async function refreshOutboxBadge() {
  const box = (await idbGet('outbox')) || [];
  const b = $('syncBtn');
  b.classList.toggle('hidden', !box.length);
  b.textContent = box.length ? `⇪${box.length}` : '⇪';
  b.title = `${box.length} run(s) waiting to upload`;
}

const rt = (s, max = 2000) => [{ type: 'text', text: { content: String(s || '').slice(0, max) } }];

function runPageBody(rec) {
  const blocks = [];
  let n = 0;
  for (const it of rec.items) {
    if (it.kind === 'section') blocks.push({ type: 'heading_3', heading_3: { rich_text: rt(it.text) } });
    if (it.kind !== 'step') continue;
    const s = rec.state[it.key] || {};
    const b = { type: 'to_do', to_do: { checked: !!s.done, rich_text: [
      ...rt(`${++n}. ${it.text}`, 1900),
      ...(s.done ? [{ type: 'text', text: { content: `  ✓ ${fmtTime(s.doneAt)}` }, annotations: { color: 'green' } }] : []),
    ] } };
    if (s.note) b.to_do.children = [{ type: 'paragraph', paragraph: { rich_text: rt('📝 ' + s.note) } }];
    blocks.push(b);
  }
  if (rec.notes) blocks.push({ type: 'heading_3', heading_3: { rich_text: rt('Notes') } },
    { type: 'paragraph', paragraph: { rich_text: rt(rec.notes) } });
  return blocks;
}

async function uploadRun(rec) {
  // A timed-out create may still have succeeded server-side — check first so a
  // retry never produces a duplicate record.
  const q = await notion(`databases/${RUNS_DB}/query`, 'POST',
    { page_size: 1, filter: { property: 'Run ID', rich_text: { equals: rec.runId } } });
  if (q.results.length) return;
  const steps = rec.items.filter(i => i.kind === 'step');
  const done = steps.filter(s => rec.state[s.key]?.done).length;
  const body = runPageBody(rec);
  const page = await notion('pages', 'POST', {
    parent: { database_id: RUNS_DB },
    properties: {
      Run: { title: rt(`${rec.sopTitle} — ${rec.operator} — ${fmtDate(rec.startedAt)}`) },
      SOP: { relation: [{ id: rec.sopId }] },
      Operator: { rich_text: rt(rec.operator) },
      Status: { select: { name: rec.status } },
      Started: { date: { start: rec.startedAt } },
      Finished: { date: { start: rec.finishedAt } },
      'Steps done': { number: done },
      'Steps total': { number: steps.length },
      Notes: { rich_text: rt(rec.notes) },
      'Run ID': { rich_text: rt(rec.runId) },
    },
    children: body.slice(0, 100),
  });
  for (let i = 100; i < body.length; i += 100) {
    await notion(`blocks/${page.id}/children`, 'PATCH', { children: body.slice(i, i + 100) });
  }
}

// Returns how many runs were uploaded.
async function syncOutbox(verbose = false) {
  if (syncing) return 0;
  syncing = true;
  let sent = 0;
  try {
    let box = (await idbGet('outbox')) || [];
    for (const rec of [...box]) {
      try {
        await uploadRun(rec);
        box = box.filter(r => r.runId !== rec.runId);
        await idbSet('outbox', box);
        sent++;
      } catch (e) {
        console.warn('run upload failed', e);
        rec.error = failureReason(e);
        await idbSet('outbox', box);
        if (isNetworkError(e)) break;   // offline: stop, try again later
      }
    }
    if (verbose) toast(box.length ? `${sent} uploaded, ${box.length} still waiting: ${box[0].error || ''}` : 'All runs uploaded ✓',
      box.length ? 'error' : 'success', 5000);
  } finally {
    syncing = false;
    refreshOutboxBadge();
  }
  return sent;
}
$('syncBtn').addEventListener('click', () => syncOutbox(true));
function updateNet() { $('netPill').classList.toggle('hidden', navigator.onLine); if (navigator.onLine) syncOutbox(); }
window.addEventListener('online', updateNet);
window.addEventListener('offline', updateNet);

// ─── RUN HISTORY ─────────────────────────────────────────────
async function showRuns() {
  setHeader('Run history', true);
  loadingView();
  const box = (await idbGet('outbox')) || [];
  let runs = [], err = null;
  try {
    const r = await notion(`databases/${RUNS_DB}/query`, 'POST', { page_size: 50, sorts: [{ property: 'Started', direction: 'descending' }] });
    runs = r.results;
  } catch (e) { err = failureReason(e); }
  const card = (title, status, when, sub, href) => el(href ? 'a' : 'div', { class: 'card', href, target: href ? '_blank' : null, rel: href ? 'noopener' : null, style: 'color:inherit;text-decoration:none' },
    el('div', { class: 'card-title', text: title }),
    el('div', { class: 'meta' }, el('span', { class: 'badge ' + status, text: status }), el('span', { text: when }), sub ? el('span', { text: sub }) : null));
  view(
    box.length ? el('div', null, el('div', { class: 'lbl', text: 'Waiting to upload' }),
      ...box.map(r => card(r.sopTitle, r.status, `${r.operator} · ${fmtDate(r.startedAt)} ${fmtTime(r.startedAt)}`, r.error ? '⚠ ' + r.error : 'pending')),
      el('button', { class: 'btn btn-block', style: 'margin:0.5rem 0 1.5rem', onclick: () => syncOutbox(true).then(showRuns) }, 'Upload now')) : null,
    err ? el('div', { class: 'banner warn', text: 'Could not load history: ' + err }) : null,
    el('div', { class: 'lbl', text: 'Recent runs' }),
    ...(runs.length ? runs.map(p => {
      const pr = p.properties;
      const started = pr.Started?.date?.start;
      return card(plain(pr.Run?.title), pr.Status?.select?.name || '—', started ? `${fmtDate(started)} ${fmtTime(started)}` : '',
        `${pr['Steps done']?.number ?? '?'}/${pr['Steps total']?.number ?? '?'} steps`, p.url);
    }) : [el('div', { class: 'empty', text: err ? '' : 'No runs logged yet.' })]));
}

// ─── EDITOR ──────────────────────────────────────────────────
// Edits the page block-by-block instead of rewriting it, so anything the editor
// can't represent (tables, sub-pages, nested content, existing photos) is kept
// untouched in place. Unchanged blocks are never re-sent, so their colours,
// mentions etc. survive too.
const ED_TYPES = [
  ['numbered_list_item', 'Numbered step'], ['to_do', 'Checkbox'], ['bulleted_list_item', 'Bullet'],
  ['paragraph', 'Text'], ['heading_1', 'Heading'], ['heading_2', 'Subheading'], ['heading_3', 'Small heading'],
  ['callout', 'Callout'], ['quote', 'Quote'], ['toggle', 'Toggle'], ['divider', 'Divider'],
];
const ED_TEXT_TYPES = new Set(ED_TYPES.map(t => t[0]).filter(t => t !== 'divider'));
const CALLOUT_ICONS = ['⚠️', '💡', 'ℹ️', '🎯', '📌', '🧤', '💧'];
let importDraft = null;   // set by the importer, consumed by showEditor(null)

// Rich text ⇄ light markdown: **bold**, *italic*, `code`, [text](https://…)
function richToMd(rtArr) {
  let lossy = false;
  const s = (rtArr || []).map(t => {
    if (t.type !== 'text') { lossy = true; return t.plain_text || ''; }
    let x = t.text.content;
    const a = t.annotations || {};
    if (a.strikethrough || a.underline || (a.color && a.color !== 'default')) lossy = true;
    if (a.code) x = '`' + x + '`';
    if (a.italic) x = '*' + x + '*';
    if (a.bold) x = '**' + x + '**';
    if (t.text.link?.url) x = `[${x}](${t.text.link.url})`;
    return x;
  }).join('');
  return { md: s, lossy };
}
function mdToRich(s) {
  const out = [];
  const push = (content, ann = {}, url) => {
    for (let i = 0; i < content.length; i += 2000) {
      const t = { type: 'text', text: { content: content.slice(i, i + 2000) } };
      if (url) t.text.link = { url };
      if (Object.keys(ann).length) t.annotations = ann;
      out.push(t);
    }
  };
  const re = /\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)|\*\*([^*]+)\*\*|\*([^*\s][^*]*)\*|`([^`]+)`/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) push(s.slice(last, m.index));
    if (m[1] != null) {
      const inner = m[1].match(/^\*\*(.+)\*\*$/);
      push(inner ? inner[1] : m[1], inner ? { bold: true } : {}, m[2]);
    }
    else if (m[3] != null) push(m[3], { bold: true });
    else if (m[4] != null) push(m[4], { italic: true });
    else push(m[5], { code: true });
    last = re.lastIndex;
  }
  if (last < s.length) push(s.slice(last));
  return out;
}

function blockToItem(b, idx) {
  const d = b[b.type] || {};
  const editable = ED_TEXT_TYPES.has(b.type) || b.type === 'divider';
  const { md, lossy } = editable && b.type !== 'divider' ? richToMd(d.rich_text) : { md: '', lossy: false };
  const kids = b.children?.length || (b.has_children ? 1 : 0);
  return {
    key: uid(), id: b.id, origIndex: idx, type: b.type, origType: b.type,
    text: md, origText: md, lossy, checked: !!d.checked, origChecked: !!d.checked,
    icon: d.icon?.emoji || '', origIcon: d.icon?.emoji || '',
    kids, locked: !editable, // locked = not editable here, kept as-is (can still be deleted)
    lockedLabel: editable ? '' : lockedLabel(b),
    imgUrl: b.type === 'image' ? imageUrl(b) : null,
  };
}
function lockedLabel(b) {
  const d = b[b.type] || {};
  if (b.type === 'image') return '📷 Photo' + (plain(d.caption) ? ' — ' + plain(d.caption) : '');
  if (b.type === 'table') return `▦ Table (${b.children?.length || '?'} rows)`;
  if (b.type === 'child_page') return '📄 Sub-page: ' + (d.title || '');
  return b.type.replace(/_/g, ' ');
}
const newItem = (type, text = '', extra = {}) => ({ key: uid(), id: null, type, text, checked: false,
  icon: type === 'callout' ? '⚠️' : '', kids: 0, locked: false, ...extra });
// Anchors keep their Notion block: nested content can't be moved or retyped
// through the API without being lost, and locked blocks can't be recreated.
const isAnchor = it => it.id && (it.kids || it.locked);
const itemChanged = it => it.text !== it.origText || it.checked !== it.origChecked || it.icon !== it.origIcon;

async function showEditor(id) {
  setHeader(id ? 'Edit SOP' : 'New SOP', true);
  let props = { title: '', category: 'Field Ops', status: 'Draft', note: '', icon: '' };
  let items = [];
  let origProps = null;
  if (id) {
    loadingView();
    const data = await loadSop(id, { force: true });   // edit the live version, never a stale copy
    if (data.offline) throw new Error('Editing needs a connection — you are offline.');
    const s = sopProps(data.page);
    props = { title: s.title, category: s.category, status: s.status, note: s.note, icon: s.icon };
    items = data.blocks.map(blockToItem);
  } else if (importDraft) {
    props = { ...props, ...importDraft.props };
    items = importDraft.items.map(i => newItem(i.type, i.text, i));

  } else {
    items = [newItem('callout', '**Purpose:** ', { icon: '🎯' }), newItem('heading_2', 'Procedure'), newItem('numbered_list_item')];
  }
  origProps = JSON.stringify(props);
  const origKeys = items.map(i => i.key).join();

    items.map(i => i.key).join() !== origKeys;

  // Properties

  const inCat = sel(CATEGORIES, props.category), inStatus = sel(STATUSES, props.status);

  const insert = (i, it) => { items.splice(i, 0, it); draw(); setTimeout(() => list.querySelector(`[data-key="${it.key}"] textarea`)?.focus(), 30); };

  function itemCard(it, i) {
    const fixed = isAnchor(it);
    const card = el('div', { class: 'ed-item' + (it.locked ? ' locked' : '') + (it.id && (itemChanged(it) || it.type !== it.origType) || !it.id ? ' changed' : ''), 'data-key': it.key });
    const typeSel = el('select', { 'aria-label': 'Block type', disabled: fixed || it.type === 'image' ? true : null },
      it.locked || it.type === 'image' ? el('option', null, it.type === 'image' ? 'Photo' : 'Kept as is') :
        ED_TYPES.map(([v, l]) => el('option', { value: v, selected: v === it.type ? true : null }, l)));
    typeSel.onchange = () => { it.type = typeSel.value; if (it.type === 'callout' && !it.icon) it.icon = '⚠️'; draw(); };
    const bar = el('div', { class: 'ed-bar' }, typeSel,

      it.type === 'callout' ? el('select', { 'aria-label': 'Callout icon', onchange: e => { it.icon = e.target.value; } },
        [...new Set([it.icon, ...CALLOUT_ICONS])].filter(Boolean).map(ic => el('option', { value: ic, selected: ic === it.icon ? true : null }, ic))) : null,
      el('span', { class: 'sp' }),
      el('button', { class: 'btn-icon', 'aria-label': 'Move up', disabled: fixed || i === 0 ? true : null, onclick: () => move(i, -1) }, '↑'),
      el('button', { class: 'btn-icon', 'aria-label': 'Move down', disabled: fixed || i === items.length - 1 ? true : null, onclick: () => move(i, 1) }, '↓'),
      el('button', { class: 'btn-icon', 'aria-label': 'Add step below', onclick: () => insert(i + 1, newItem(it.type === 'to_do' ? 'to_do' : 'numbered_list_item')) }, '＋'),

  } });

  draw();
  view(
    el('div', { style: 'display:flex;gap:0.75rem' }, f('Icon', inIcon), el('div', { style: 'flex:1' }, f('Title', inTitle))),
    el('div', { style: 'display:flex;gap:0.75rem' }, el('div', { style: 'flex:1' }, f('Category', inCat)), el('div', { style: 'flex:1' }, f('Status', inStatus))),

    list,
    el('div', { class: 'ed-add' }, addBtn('＋ Step', 'numbered_list_item'), addBtn('＋ Checkbox', 'to_do'), addBtn('＋ Subheading', 'heading_2'),

  );
  const saveBtn = el('button', { class: 'btn btn-primary btn-lg', onclick: async () => {
    if (!props.title.trim()) { toast('Give the SOP a title', 'error'); inTitle.focus(); return; }
    saveBtn.disabled = true;
    const setStatus = m => { saveBtn.replaceChildren(el('span', { class: 'spinner' }), ' ' + m); };
    try {
      const pageId = id ? await saveExisting(id, props, JSON.parse(origProps), items, setStatus) : await saveNew(props, items, setStatus);
      leaveGuard = null;
      // Mark the list stale (refetched on next visit) without dropping the offline copy.
      const cachedList = await idbGet('sops');
      if (cachedList) await idbSet('sops', { ...cachedList, at: 0 });
      toast('Saved to Notion ✓', 'success');
      if (id) history.back(); else location.replace('#/sop/' + pageId.replace(/-/g, ''));
      await loadSop(pageId.replace(/-/g, ''), { force: true }).then(() => route()).catch(() => {});
    } catch (e) {
      console.warn(e);
      toast('Save failed: ' + failureReason(e), 'error', 6000);
      saveBtn.disabled = false; saveBtn.textContent = 'Save to Notion';
    }
  } }, 'Save to Notion');
  bottomBar(el('button', { class: 'btn btn-lg', onclick: () => history.back() }, 'Cancel'), saveBtn);
